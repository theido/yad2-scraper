name: Yad2 Scraper

on:
  push:
    branches:
      - main
  # Paused on 2026-06-11 per request:
  # schedule:
  #   - cron: "0 9,17 * * *"
  workflow_dispatch:

jobs:
  scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install packages
        run: yarn install --frozen-lockfile --non-interactive

      - name: Setup git config
        run: |
          git config user.name "GitHub Actions"
          git config user.email "${{ secrets.GIT_CONFIG_EMAIL }}"

      - name: Run scraper
        run: |
          export API_TOKEN=${{ secrets.API_TOKEN }}
          export CHAT_ID=${{ secrets.CHAT_ID }}
          yarn scrape

      - name: Push new json data if needed
        run: |
          if [ -f ./push_me ]; then
            echo Pushing to Github...
            git add data/*.json
            DATE=$(date +"%F, %H:%M:%S")
            if git diff --cached --quiet; then
              echo "No data changes to commit."
              exit 0
            fi
            git commit -m "updated data - $DATE"
            git push
          else
            echo "No push flag found; skipping commit."
          fi
