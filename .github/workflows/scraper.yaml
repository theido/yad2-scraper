name: Yad2 Scraper

on:
  push:
    branches:
      - main
  # Paused on 2026-06-11 per request:
  # schedule:
  #   - cron: "0 9,17 * * *"
  workflow_dispatch:

jobs:
  scraper:
    # Yad2 blocks GitHub-hosted datacenter runners. This job must run from a
    # logged-in macOS user session so headful Chrome can execute the challenge.
    runs-on: [self-hosted, macOS, yad2-browser]
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci --no-audit --no-fund

      - name: Setup git config
        run: |
          git config user.name "GitHub Actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run scraper
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          SCRAPER_PROJECTS: ${{ vars.SCRAPER_PROJECTS }}
        run: |
          export YAD2_FETCH_MODE=chrome
          export YAD2_CHROME_HEADLESS=0
          export YAD2_CHROME_PROFILE_DIR="$HOME/.yad2-scraper/chrome-profile"
          export CHROME_EXECUTABLE_PATH="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          test -x "$CHROME_EXECUTABLE_PATH"
          "$CHROME_EXECUTABLE_PATH" --version
          npm run scrape

      - name: Push new json data if needed
        run: |
          if [ -f ./push_me ]; then
            echo Pushing to Github...
            git add data/*.json
            DATE=$(date +"%F, %H:%M:%S")
            if git diff --cached --quiet; then
              echo "No data changes to commit."
              exit 0
            fi
            git commit -m "updated data - $DATE"
            git push
          else
            echo "No push flag found; skipping commit."
          fi
